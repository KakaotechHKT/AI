name: Deploy with Docker Compose

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

    env:
      IMAGE_TAG: ${{ github.ref == 'refs/heads/main' && '' || 'dev-' }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push babpat-ai image
        run: |
          docker build -t $DOCKER_USERNAME/${{ env.IMAGE_TAG }}babpat-ai:latest .
          docker push $DOCKER_USERNAME/${{ env.IMAGE_TAG }}babpat-ai:latest

      - name: Build and push elasticsearch image
        run: |
          docker build -t $DOCKER_USERNAME/${{ env.IMAGE_TAG }}babpat-elasticsearch:latest ./elasticsearch
          docker push $DOCKER_USERNAME/${{ env.IMAGE_TAG }}babpat-elasticsearch:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

    env:
      IMAGE_TAG: ${{ github.ref == 'refs/heads/main' && '' || 'dev-' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v2

      - name: Prepare SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Copy docker-compose.yml to server
        run: |
          scp -i key.pem -o StrictHostKeyChecking=no docker-compose.yml ubuntu@${{ secrets.SERVER_IP }}:~/babpat-ai/

      - name: SSH to server and deploy
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMAGE_TAG: ${{ github.ref == 'refs/heads/main' && '' || 'dev-' }}
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.SERVER_IP }} << EOF
          echo "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USERNAME" --password-stdin

          cd ~/babpat-ai

          # .env 재생성
          echo 'DB_HOST="'$DB_HOST'"' > .env
          echo 'DB_NAME="'$DB_NAME'"' >> .env
          echo 'DB_USER="'$DB_USER'"' >> .env
          echo 'DB_PASSWORD="'$DB_PASSWORD'"' >> .env
          echo 'OPENAI_API_KEY="'$OPENAI_API_KEY'"' >> .env
          echo 'GEMINI_API_KEY="'$GEMINI_API_KEY'"' >> .env
          echo "AI_IMAGE=$DOCKER_USERNAME/${IMAGE_TAG}babpat-ai:latest" > .env
          echo "ES_IMAGE=$DOCKER_USERNAME/${IMAGE_TAG}babpat-elasticsearch:latest" >> .env

          docker-compose pull || true
          docker-compose down || true
          docker-compose up -d

          docker system prune -af
          EOF