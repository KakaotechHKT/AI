name: Deploy with Docker Compose

on:
  push:
    branches:
      - main
      - dev
      - refact

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Copy docker-compose file to server
        run: |
          scp -i key.pem -o StrictHostKeyChecking=no docker-compose.yml ubuntu@${{ secrets.SERVER_IP }}:~/babpat-ai/

      - name: SSH to server and deploy
        env:
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no ubuntu@${{ secrets.SERVER_IP }} << 'EOF'
echo "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USERNAME" --password-stdin

cd ~/babpat-ai

# .env 재생성
echo 'DB_HOST="'$DB_HOST'"' > .env
echo 'DB_NAME="'$DB_NAME'"' >> .env
echo 'DB_USER="'$DB_USER'"' >> .env
echo 'DB_PASSWORD="'$DB_PASSWORD'"' >> .env
echo 'OPENAI_API_KEY="'$OPENAI_API_KEY'"' >> .env
echo 'GEMINI_API_KEY="'$GEMINI_API_KEY'"' >> .env

# 기존 컨테이너 제거 (컨테이너 이름과 일치하는지 확인)
docker stop babpat-ai || true
docker rm -f babpat-ai || true
docker rmi -f $IMAGE_NAME || true

# 기존 docker-compose 서비스 정리
docker-compose -f docker-compose.yml down || true

# 이미지 새로 pull 및 컨테이너 실행
docker-compose -f docker-compose.yml pull || true
docker-compose -f docker-compose.yml up -d --build

docker system prune -af
EOF