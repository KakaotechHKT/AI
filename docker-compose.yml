version: "3.8"

services:
  elasticsearch:
    image: yunabyte/babpat-elasticsearch:latest
    container_name: elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s


  babpat-ai:
    image: yunabyte/dev-babpat-ai:latest
    container_name: babpat-ai
    ports:
      - "8000:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
    env_file:
      - .env

volumes:
  esdata:
