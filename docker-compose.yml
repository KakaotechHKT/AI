version: "3.8"

services:
  elasticsearch:
    image: ${ES_IMAGE}
    container_name: elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5              
      start_period: 60s


  babpat-ai:
    image: ${AI_IMAGE}
    container_name: babpat-ai
    ports:
      - "8000:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
    env_file:
      - .env

volumes:
  esdata:
